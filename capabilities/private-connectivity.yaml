naftiko: 1.0.0-alpha2
info:
  label: Amazon PrivateLink Private Connectivity
  description: Workflow capability for establishing and managing private connectivity between VPCs and AWS services using
    Amazon PrivateLink. Covers endpoint service creation, VPC endpoint management, and connection lifecycle for network engineers
    and platform teams.
  tags:
  - Amazon
  - AWS
  - Networking
  - Private Connectivity
  - VPC
  - Security
  - Zero Trust
  created: '2026-04-19'
  modified: '2026-05-06'
binds:
- namespace: env
  keys:
    AWS_ACCESS_KEY_ID: AWS_ACCESS_KEY_ID
    AWS_SECRET_ACCESS_KEY: AWS_SECRET_ACCESS_KEY
    AWS_REGION: AWS_REGION
capability:
  consumes:
  - type: http
    namespace: amazon-privatelink
    baseUri: https://ec2.{region}.amazonaws.com
    description: Amazon PrivateLink (EC2 API) private connectivity endpoints
    authentication:
      type: apikey
      key: Authorization
      value: '{{AWS_ACCESS_KEY_ID}}'
      placement: header
    resources:
    - name: endpoint-services
      path: /?Action=DescribeVpcEndpointServices
      description: VPC endpoint services
      operations:
      - name: describe-endpoint-services
        method: GET
        description: List available VPC endpoint services
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: create-endpoint-service
        method: POST
        description: Create a VPC endpoint service configuration
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        body:
          type: json
          data:
            NetworkLoadBalancerArn: '{{tools.nlb_arn}}'
            AcceptanceRequired: '{{tools.acceptance_required}}'
    - name: endpoints
      path: /?Action=DescribeVpcEndpoints
      description: VPC endpoints
      operations:
      - name: describe-endpoints
        method: GET
        description: List VPC endpoints in the account
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: create-endpoint
        method: POST
        description: Create a VPC endpoint for a service
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        body:
          type: json
          data:
            VpcId: '{{tools.vpc_id}}'
            ServiceName: '{{tools.service_name}}'
            VpcEndpointType: '{{tools.endpoint_type}}'
    - name: endpoint-connections
      path: /?Action=DescribeVpcEndpointConnections
      description: VPC endpoint connections
      operations:
      - name: describe-connections
        method: GET
        description: List connections to endpoint services
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: accept-connections
        method: POST
        description: Accept VPC endpoint connections
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        body:
          type: json
          data:
            ServiceId: '{{tools.service_id}}'
            VpcEndpointId: '{{tools.endpoint_ids}}'
      - name: reject-connections
        method: POST
        description: Reject VPC endpoint connections
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        body:
          type: json
          data:
            ServiceId: '{{tools.service_id}}'
            VpcEndpointId: '{{tools.endpoint_ids}}'
  exposes:
  - type: rest
    port: 8080
    namespace: private-connectivity-api
    description: Unified REST API for Amazon PrivateLink private connectivity workflows.
    resources:
    - path: /v1/endpoint-services
      name: endpoint-services
      description: VPC endpoint service provider management
      operations:
      - method: GET
        name: list-endpoint-services
        description: List VPC endpoint services
        call: amazon-privatelink.describe-endpoint-services
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: create-endpoint-service
        description: Create a VPC endpoint service
        call: amazon-privatelink.create-endpoint-service
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/endpoints
      name: endpoints
      description: VPC endpoint consumer management
      operations:
      - method: GET
        name: list-endpoints
        description: List VPC endpoints
        call: amazon-privatelink.describe-endpoints
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: create-endpoint
        description: Create a VPC endpoint
        call: amazon-privatelink.create-endpoint
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/connections
      name: connections
      description: Endpoint connection management
      operations:
      - method: GET
        name: list-connections
        description: List endpoint connections
        call: amazon-privatelink.describe-connections
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: accept-connections
        description: Accept endpoint connections
        call: amazon-privatelink.accept-connections
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    port: 9090
    namespace: private-connectivity-mcp
    transport: http
    description: MCP server for AI-assisted private connectivity workflows with Amazon PrivateLink.
    tools:
    - name: list-endpoint-services
      description: List available VPC endpoint services for private connectivity
      hints:
        readOnly: true
        openWorld: true
      call: amazon-privatelink.describe-endpoint-services
      outputParameters:
      - type: object
        mapping: $.
    - name: create-endpoint-service
      description: Create a VPC endpoint service backed by a load balancer
      hints:
        readOnly: false
        destructive: false
      call: amazon-privatelink.create-endpoint-service
      outputParameters:
      - type: object
        mapping: $.
    - name: list-vpc-endpoints
      description: List VPC endpoints in the account
      hints:
        readOnly: true
        openWorld: true
      call: amazon-privatelink.describe-endpoints
      outputParameters:
      - type: object
        mapping: $.
    - name: create-vpc-endpoint
      description: Create a private VPC endpoint for an AWS service or endpoint service
      hints:
        readOnly: false
        destructive: false
      call: amazon-privatelink.create-endpoint
      with:
        vpc_id: tools.vpc_id
        service_name: tools.service_name
      outputParameters:
      - type: object
        mapping: $.
    - name: list-endpoint-connections
      description: List pending and active connections to endpoint services
      hints:
        readOnly: true
        openWorld: true
      call: amazon-privatelink.describe-connections
      outputParameters:
      - type: object
        mapping: $.
    - name: accept-endpoint-connections
      description: Accept pending VPC endpoint connection requests
      hints:
        readOnly: false
        destructive: false
      call: amazon-privatelink.accept-connections
      with:
        service_id: tools.service_id
        endpoint_ids: tools.endpoint_ids
      outputParameters:
      - type: object
        mapping: $.
    - name: reject-endpoint-connections
      description: Reject VPC endpoint connection requests
      hints:
        readOnly: false
        destructive: true
      call: amazon-privatelink.reject-connections
      with:
        service_id: tools.service_id
        endpoint_ids: tools.endpoint_ids
      outputParameters:
      - type: object
        mapping: $.
